name: Build and Publish Installers

on:
  push:
    tags:
      - "v*" # Trigger on version tags, e.g. v1.0.0
  workflow_dispatch: # Enable manual triggers

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          architecture: ${{ matrix.arch }}
          cache: "gradle"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up WiX Toolset (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Get-Command candle -ErrorAction SilentlyContinue) {
            Write-Host "WiX is already in the system PATH"
          } else {
            $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
            if (Test-Path $wixPath) {
              echo "$wixPath" >> $env:GITHUB_PATH
            }
          }
        shell: powershell

      - name: Run Build and Package Installer (Windows)
        if: runner.os == 'Windows'
        run: |
          ./gradlew.bat jpackage
          ./build-msix.ps1
        shell: powershell

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            build/jpackage/*.msi
            build/jpackage/*.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
