name: Build and Publish Installers

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g. v1.0.0
  workflow_dispatch: # Enable manual triggers

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: ${{ matrix.arch }}
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up WiX Toolset (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Get-Command candle -ErrorAction SilentlyContinue) {
            Write-Host "WiX is already in the system PATH"
          } else {
            $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
            if (Test-Path $wixPath) {
              echo "$wixPath" >> $env:GITHUB_PATH
            }
          }
        shell: powershell

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm

      - name: Run Build and Package Installer (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew.bat jpackage
        shell: cmd

      - name: Run Build and Package Installer (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew jpackage
        shell: bash

      - name: Sign Installer (Windows only)
        if: runner.os == 'Windows'
        run: |
          $cerPath = "certificate\note_p.cer"
          if (Test-Path $cerPath) {
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($cerPath)
            if (-not $cert.HasPrivateKey) {
              Write-Host "Warning: Certificate does not contain a private key. A .pfx file with a private key is required for code signing. Skipping code signing."
            } else {
              $installers = Get-ChildItem -Path "build/jpackage" -File | Where-Object { $_.Extension -eq '.msi' -or $_.Extension -eq '.exe' }
              foreach ($installer in $installers) {
                Write-Host "Signing $($installer.FullName)..."
                try {
                  Set-AuthenticodeSignature -FilePath $installer.FullName -Certificate $cert -HashAlgorithm SHA256 -ErrorAction Stop
                } catch {
                  Write-Host "Warning: Failed to sign $($installer.FullName). The certificate may not be suitable for code signing (e.g., missing Code Signing EKU). Skipping..."
                }
              }
            }
          } else {
            Write-Host "Certificate file not found at $cerPath. Skipping code signing."
          }
        shell: powershell


      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            build/jpackage/*.msi
            build/jpackage/*.exe
            build/jpackage/*.dmg
            build/jpackage/*.pkg
            build/jpackage/*.deb
            build/jpackage/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
