<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --bubble-bg-ai: #f4f4f4;
            --bubble-bg-user: #e3f2fd;
            --border-color: #e0e0e0;
            --code-bg: #2d2d2d;
            --accent: #007ACC;
        }
        body.dark-mode {
            --bg-color: #1e1e1e;
            --text-color: #d4d4d4;
            --bubble-bg-ai: #2a2a2a;
            --bubble-bg-user: #004b73;
            --border-color: #3a3a3a;
            --code-bg: #111111;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            font-size: 13px; /* Smaller text size */
        }
        .message {
            margin-bottom: 24px;
            padding: 0;
            border: none;
            background-color: transparent !important;
            position: relative;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-x: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        .toolbar { display: flex; gap: 8px; }
        .icon-btn {
            background: none; border: none; cursor: pointer; opacity: 0.6;
            color: var(--text-color); font-size: 14px; padding: 0;
        }
        .icon-btn:hover { opacity: 1; }
        
        /* Markdown Styles */
        pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; max-width: 100%; white-space: pre; }
        code { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; }
        table { border-collapse: collapse; max-width: 100%; margin-bottom: 10px; display: block; overflow-x: auto; white-space: nowrap; }
        th, td { border: 1px solid var(--border-color); padding: 6px 10px; text-align: left; }
        th { background-color: rgba(0,0,0,0.05); }
        body.dark-mode th { background-color: rgba(255,255,255,0.05); }
        blockquote { border-left: 4px solid var(--accent); margin: 0; padding-left: 10px; color: #888; }
        
        .loading { font-style: italic; opacity: 0.7; font-size: 12px; }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'default' });
        
        const messageTexts = {}; // Store raw markdown for copying

        function getRawText(id) {
            return messageTexts[id] || "";
        }

        function setTheme(isDark) {
            if (isDark) document.body.classList.add('dark-mode');
            else document.body.classList.remove('dark-mode');
        }

        function appendMessage(id, isUser, markdownText) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.id = 'msg-' + id;
            msgDiv.className = 'message ' + (isUser ? 'user' : 'ai');
            
            const copySvg = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
            const reportSvg = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;

            let headerHTML = `<div class="header">
                <span>${isUser ? '👤 You' : '🤖 Redix'}</span>
                <div class="toolbar">
                    <button class="icon-btn" onclick="app.copyText('${id}')" title="Copy">${copySvg}</button>
                    ${!isUser ? `<button class="icon-btn" onclick="app.reportText('${id}')" title="Report">${reportSvg}</button>` : ''}
                </div>
            </div>`;
            
            const contentDiv = document.createElement('div');
            contentDiv.id = 'content-' + id;
            
            msgDiv.innerHTML = headerHTML;
            msgDiv.appendChild(contentDiv);
            container.appendChild(msgDiv);
            
            updateMessage(id, markdownText);
        }

        function updateMessage(id, markdownText) {
            messageTexts[id] = markdownText;
            const contentDiv = document.getElementById('content-' + id);
            if (!contentDiv) return;
            
            if (markdownText === '[LOADING]') {
                contentDiv.innerHTML = '<div class="loading">Redix is thinking...</div>';
                window.scrollTo(0, document.body.scrollHeight);
                return;
            }
            
            // Clean markdown for rendering
            let html = marked.parse(markdownText);
            contentDiv.innerHTML = html;
            
            // Apply Prism and Mermaid
            Prism.highlightAllUnder(contentDiv);
            
            // Render Mermaid diagrams
            const mermaidDivs = contentDiv.querySelectorAll('.language-mermaid');
            mermaidDivs.forEach((el, index) => {
                const graphDef = el.textContent;
                const mDiv = document.createElement('div');
                mDiv.className = 'mermaid';
                const mId = 'mermaid-' + id + '-' + index;
                try {
                    mermaid.render(mId, graphDef).then(({svg}) => {
                        mDiv.innerHTML = svg;
                        el.parentNode.replaceWith(mDiv);
                        window.scrollTo(0, document.body.scrollHeight);
                    });
                } catch (e) {
                    console.error('Mermaid error', e);
                }
            });
            
            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
    <div id="disclaimer" style="text-align: center; font-size: 10px; color: var(--text-color); opacity: 0.6; margin-top: 20px; padding-bottom: 20px;">
        Redix AI can make mistakes. Check important info.
    </div>
</body>
</html>
